name: Cloud Build AuraOS

on:
  push:
    branches: [ "**" ] # Срабатывает на ВСЕ ветки, включая "main", "master" и "основной"
  workflow_dispatch:   # Позволяет запустить сборку вручную кнопкой во вкладке Actions

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Скачивание репозитория
      uses: actions/checkout@v4

    - name: 🔍 Поиск Makefile и файлов проекта
      run: |
        echo "--- Проверяем структуру репозитория ---"
        ls -R

    - name: 🛠️ Установка системных утилит (lld, objcopy)
      run: |
        sudo apt update
        sudo apt install -y build-essential lld binutils-aarch64-linux-gnu

    - name: 📦 Настройка Rust и таргета ARM64
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-none

    - name: 🎨 Настройка Swift (Embedded)
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.0'

    - name: 🚀 Запуск компиляции
      run: |
        # Скрипт сам найдет Makefile, где бы он ни лежал, и запустит сборку там
        MAKEFILE_PATH=$(find . -name "Makefile" | head -n 1)
        if [ -z "$MAKEFILE_PATH" ]; then
          echo "❌ Ошибка: Makefile не найден в репозитории!"
          exit 1
        fi
        cd $(dirname "$MAKEFILE_PATH")
        make clean
        make all

    - name: 💾 Сохранение готовой прошивки
      uses: actions/upload-artifact@v4
      with:
        name: aura_os_firmware
        path: "**/aura_os.img" # Ищет готовый образ в любой папке, где он собрался
