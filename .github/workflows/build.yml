name: Cloud Build AuraOS

on:
  push:
    branches: [ "**" ] # Срабатывает на абсолютно любые пуши в любые ветки
  workflow_dispatch:   # Позволяет запустить сборку вручную кнопкой в браузере

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Скачивание репозитория
      uses: actions/checkout@v4

    - name: 🛠️ Установка системных утилит (lld, objcopy)
      run: |
        sudo apt update
        sudo apt install -y build-essential lld binutils-aarch64-linux-gnu

    - name: 📦 Настройка Rust и таргета ARM64
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-none

    - name: 🎨 Настройка Swift (Embedded)
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.0'

    - name: 🚀 Запуск компиляции
      run: |
        MAKEFILE_PATH=$(find . -name "Makefile" | head -n 1)
        if [ -z "$MAKEFILE_PATH" ]; then
          echo "❌ Ошибка: Файл Makefile вообще не найден в репозитории!"
          exit 1
        fi
        
        cd $(dirname "$MAKEFILE_PATH")
        
        echo "--- Запуск чистой сборки ---"
        # Запускаем сборку вручную, чтобы перехватить текстовый вывод ошибок Swift
        make clean
        
        echo "📦 Компиляция Rust микроядра..."
        cargo build --target arm64-auraos-none --release || exit 2
        
        echo "🎨 Компиляция Swift сервисов..."
        # Запускаем swiftc напрямую, чтобы увидеть полную трассировку ошибок
        swiftc -target arm64-apple-none -O -parse-as-library -enable-experimental-feature EmbeddedSwift sys_services/*.swift -o build/services.o

    - name: 💾 Сохранение готовой прошивки
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: aura_os_firmware
        path: "**/aura_os.img"
