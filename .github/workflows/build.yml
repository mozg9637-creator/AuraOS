name: Cloud Build AuraOS

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Скачивание репозитория
      uses: actions/checkout@v4

    - name: 🛠️ Установка системных утилит (lld, objcopy)
      run: |
        sudo apt update
        sudo apt install -y build-essential lld binutils-aarch64-linux-gnu

    - name: 📦 Настройка Rust и таргета ARM64
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-none

    - name: 🎨 Настройка Swift (Embedded)
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.0'

    - name: 🚀 Полная компиляция AuraOS
      run: |
        mkdir -p build
        
        echo "📦 1. Компиляция микроядра AuraCore (Rust)..."
        cargo build --target aarch64-unknown-none --release --quiet
        
        echo "🧹 Удаляем конфликтующий дубликат оболочки..."
        rm -f sys_services/AuraShellг.swift
        
        echo "🎨 2. Компиляция графической оболочки и приложений (Swift)..."
        swiftc -target aarch64-unknown-none-elf \
               -O -wmo -parse-as-library \
               -enable-experimental-feature EmbeddedSwift \
               -Xfrontend -disable-objc-interop \
               sys_services/AuraNetworkStack.swift \
               sys_services/AuraShell.swift \
               -o build/services.o
          
        echo "🔗 3. Линковка компонентов и создание прошивки..."
        ld.lld build/services.o target/aarch64-unknown-none/release/libaura_core.a -o build/aura_os.elf
        objcopy -O binary build/aura_os.elf aura_os.img
        echo "🔥 [УСПЕХ] AuraOS успешно собрана!"

    - name: 💾 Сохранение готовой прошивки
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: aura_os_firmware
        path: aura_os.img
