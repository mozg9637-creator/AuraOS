name: Cloud Build AuraOS

on:
  push:
    branches: [ "основной" ] # Собирать систему каждый раз, когда ты делаешь пуш в ветку "основной"
  workflow_dispatch:        # Позволяет запускать сборку вручную кнопкой на сайте

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Скачивание репозитория
      uses: actions/checkout@v4

    - name: 🛠️ Установка системных утилит (lld, objcopy)
      run: |
        sudo apt update
        sudo apt install -y build-essential lld binutils-aarch64-linux-gnu

    - name: 📦 Настройка Rust и таргета ARM64
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-none

    - name: 🎨 Настройка Swift (Embedded)
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.0' # Используем свежий Swift с поддержкой Embedded

    - name: 🚀 Запуск компиляции (Makefile)
      run: |
        make clean
        make all

    - name: 💾 Сохранение готовой прошивки
      uses: actions/upload-artifact@v4 # <-- ВОТ ТУТ ИСПРАВЛЕНО!
      with:
        name: aura_os_firmware
        path: aura_os.img # Сохраняем получившийся образ системы
