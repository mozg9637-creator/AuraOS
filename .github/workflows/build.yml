name: Cloud Build AuraOS

on:
  push:
    branches: [ "**" ] # Срабатывает на абсолютно любые пуши в любые ветки
  workflow_dispatch:   # Позволяет запустить сборку вручную кнопкой в браузере

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Скачивание репозитория
      uses: actions/checkout@v4

    - name: 🔍 Поиск Makefile и файлов проекта
      run: |
        echo "=== СТРУКТУРА КОРНЯ РЕПОЗИТОРИЯ ==="
        ls -la
        echo "==================================="

    - name: 🛠️ Установка системных утилит (lld, objcopy)
      run: |
        sudo apt update
        sudo apt install -y build-essential lld binutils-aarch64-linux-gnu

    - name: 📦 Настройка Rust и таргета ARM64
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-none

    - name: 🎨 Настройка Swift (Embedded)
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.0'

    - name: 🚀 Запуск компиляции
      run: |
        # Автоматический поиск Makefile в репозитории
        MAKEFILE_PATH=$(find . -name "Makefile" | head -n 1)
        if [ -z "$MAKEFILE_PATH" ]; then
          echo "❌ Ошибка: Файл Makefile вообще не найден в репозитории!"
          exit 1
        fi
        
        # Переходим в директорию, где лежит найденный Makefile
        cd $(dirname "$MAKEFILE_PATH")
        
        echo "=== ПРОВЕРКА ОКРУЖЕНИЯ ПЕРЕД СБОРКОЙ ==="
        echo "Текущая рабочая директория: $(pwd)"
        echo "Содержимое папки sys_services:"
        ls -la sys_services || echo "⚠️ Папка sys_services не найдена по этому пути!"
        echo "Содержимое папки src:"
        ls -la src || echo "⚠️ Папка src не найдена по этому пути!"
        echo "========================================"
        
        echo "--- Запуск сборки системы ---"
        # Запускаем make со стандартным выводом всех шагов компиляции
        make clean
        make all

    - name: 💾 Сохранение готовой прошивки
      if: success() # Выполняется только если сборка прошла успешно
      uses: actions/upload-artifact@v4
      with:
        name: aura_os_firmware
        path: "**/aura_os.img"
